name: Build Kernel
on:
  workflow_dispatch: # 手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm

      - name: Download Clang
        run: |
          mkdir clang
          cd clang
          # 下载 AOSP Clang (骁龙 888 推荐使用 r416183b 或更高)
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r416183b.tar.gz
          tar -xf clang-r416183b.tar.gz

      - name: Build Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          # 注意：这里的 alioth_defconfig 需要换成你 arch/arm64/configs/ 下对应的文件名
          make O=out vendor/alioth_defconfig
          
          # 这一步会修改配置开启 RNDIS
          scripts/config --file out/.config --enable CONFIG_USB_NET_RNDIS_HOST
          scripts/config --file out/.config --enable CONFIG_USB_NET_RNDIS_WLAN
          
          make -j$(nproc) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            LD=ld.lld

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v3
        with:
          name: Kernel-Image
          path: out/arch/arm64/boot/Image
          # 5. 开始正式编译（这一步最耗时）
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 -j$(nproc)

      - name: 上传内核成品
        uses: actions/upload-artifact@v4
        with:
          name: Renoir-Kernel-Image
          path: out/arch/arm64/boot/Image
          # 3. 核心：强制开启 RNDIS 驱动（防止配置文件里没写进去）
          echo "CONFIG_USB_NET_DRIVERS=y" >> out/.config
          echo "CONFIG_USB_NET_RNDIS=y" >> out/.config
          echo "CONFIG_USB_NET_CDC_ETHER=y" >> out/.config
          
          # 4. 自动处理新配置项并核对
          make O=out ARCH=arm64 olddefconfig
          
          # 5. 正式编译内核
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 -j$(nproc)

      - name: 提取 Image 成品
        uses: actions/upload-artifact@v4
        with:
          name: Renoir-Kernel-Image
          path: out/arch/arm64/boot/Image
