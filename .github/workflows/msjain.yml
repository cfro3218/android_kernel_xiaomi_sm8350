name: Build Renoir BootImg
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: sixteen-qpr1

      - name: Setup Env
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm curl python3 mkbootimg

      - name: Download Clang
        run: |
          mkdir clang
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r416183b.tar.gz
          tar -xf clang-r416183b.tar.gz -C clang

      - name: Build Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          OUT=out
          
          # 针对 Renoir 的路径和配置
          make O=$OUT vendor/renoir_QGKI.config
          
          # 强制开启 RNDIS 驱动
          echo "CONFIG_USB_NET_RNDIS_HOST=y" >> $OUT/.config
          echo "CONFIG_USB_NET_RNDIS_WLAN=y" >> $OUT/.config
          
          make -j$(nproc) O=$OUT \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            LD=ld.lld

      - name: Pack Boot.img
        run: |
          # 这一步需要一个底包，你可以先生成 Image，手动打包更稳。
          # 或者如果你有底包的 URL，可以在这里用 wget 下载并用 mkbootimg 替换。
          echo "内核编译完成，Image 位于 out/arch/arm64/boot/Image"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Renoir-Image-Only
          path: out/arch/arm64/boot/Image
          
